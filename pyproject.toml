[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codementor"
version = "0.1.0"
description = "Evidence-driven AI code review and learning assistant"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115,<1",
	"openai>=2,<3",
	"pydantic>=2.7,<3",
	"uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
codementor-review-fixture = "app.cli.review_fixture:main"
codementor-review-local = "app.cli.review_local:main"
codementor-evaluate-fixtures = "app.cli.evaluate_fixtures:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]